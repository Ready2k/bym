<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101828">
    <title>Super 6 — Decision Centre</title>
    <link rel="stylesheet" href="/assets/styles.css">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Primary navigation">
        <a class="brand" href="#home" aria-label="Super 6 home"><span class="brand-mark">S6</span><span>Super 6</span></a>
        <nav class="nav-list" aria-label="Main">
          <a class="nav-link" data-page-link="home" href="#home"><span>Home</span></a>
          <a class="nav-link" data-page-link="round" href="#round"><span>Round</span></a>
          <a class="nav-link" data-page-link="cup" href="#cup"><span>Cup Match</span></a>
          <a class="nav-link" data-page-link="lms" href="#lms"><span>Last Man Standing</span></a>
          <a class="nav-link" data-page-link="league" href="#league"><span>League</span></a>
          <a class="nav-link" data-page-link="opponents" href="#opponents"><span>Opponents</span></a>
          <a class="nav-link" data-page-link="performance" href="#performance"><span>Performance</span></a>
          <a class="nav-link" data-page-link="activity" href="#activity"><span>Activity</span></a>
          <a class="nav-link mobile-more" data-page-link="more" href="#more"><span>More</span></a>
        </nav>
        <nav class="nav-list secondary" aria-label="Expert">
          <p class="nav-label">Expert</p>
          <a class="nav-link" data-page-link="model" href="#model"><span>Model Lab</span></a>
          <a class="nav-link" data-page-link="sources" href="#sources"><span>Sources</span></a>
          <a class="nav-link" data-page-link="health" href="#health"><span>System Health</span></a>
          <a class="nav-link" data-page-link="settings" href="#settings"><span>Settings</span></a>
        </nav>
        <p class="sidebar-note">We recommend. You enter predictions in Super 6 yourself.</p>
      </aside>
      <main id="main" class="main-content" tabindex="-1">
        <div id="loading" class="loading-panel" role="status">Building your decision centre…</div>
        <div id="error" class="error-panel" role="alert" hidden></div>
        <div id="app" hidden></div>
      </main>
    </div>

    <dialog id="fixture-dialog" class="dialog fixture-dialog"><button class="close-button" data-close="fixture-dialog" aria-label="Close fixture detail">×</button><div id="fixture-detail"></div></dialog>
    <dialog id="entry-dialog" class="dialog entry-dialog"><button class="close-button" data-close="entry-dialog" aria-label="Close confirmation">×</button><div id="entry-detail"></div></dialog>
    <dialog id="round-dialog" class="dialog entry-dialog"><button class="close-button" data-close="round-dialog" aria-label="Close deadline confirmation">×</button><div id="round-detail"></div></dialog>
    <dialog id="info-dialog" class="dialog info-dialog"><button class="close-button" data-close="info-dialog" aria-label="Close explanation">×</button><div id="info-detail"></div></dialog>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script src="/assets/app.js" defer></script>
  </body>
</html>
