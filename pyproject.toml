[project]
name = "super6-agent"
version = "0.1.0"
description = "Super 6 always-on prediction agent — Phase 1A prediction engine (SPEC.md)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "pandas>=2.2",
    "requests>=2.32",
]

[project.scripts]
super6 = "super6.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/super6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
