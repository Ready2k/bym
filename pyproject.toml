[project]
name = "beat-your-mates"
version = "0.1.0"
description = "Beat Your Mates — always-on prediction agent for Super 6 and Last Man Standing (SPEC.md)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "pandas>=2.2",
    "requests>=2.32",
]

[project.scripts]
bym = "bym.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bym"]

[tool.pytest.ini_options]
testpaths = ["tests"]
